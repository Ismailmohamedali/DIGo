<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020a1f"/>
      <stop offset="55%" stop-color="#071633"/>
      <stop offset="100%" stop-color="#0a2050"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e6fff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow1)"/>
  <polygon points="800,0 800,160 630,0" fill="#1e6fff" fill-opacity="0.12"/>
  <polygon points="0,600 0,440 190,600" fill="#00aaff" fill-opacity="0.08"/>
  <!-- incisor + bone remodeling icon -->
  <g transform="translate(560,280)" opacity="0.95">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#1e6fff" stroke-opacity="0.22" stroke-width="1.5"/>
    <!-- tooth outline -->
    <path d="M -25 -90 Q -35 -50 -25 0 L -18 90 L 0 30 L 18 90 L 25 0 Q 35 -50 25 -90 Q 0 -105 -25 -90 Z" fill="none" stroke="#5fd4ff" stroke-width="3"/>
    <!-- bone contour lines -->
    <path d="M -60 -60 Q -70 0 -55 70" fill="none" stroke="#ff8a3d" stroke-width="4" stroke-dasharray="2,6" stroke-linecap="round"/>
    <path d="M 60 -60 Q 70 0 55 70" fill="none" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round"/>
    <!-- measurement ticks -->
    <line x1="-60" y1="-20" x2="-25" y2="-20" stroke="#5fd4ff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="-60" y1="10" x2="-25" y2="10" stroke="#5fd4ff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="-60" y1="40" x2="-25" y2="40" stroke="#5fd4ff" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
